[workspace]
# Each module keeps its crates in modules/<id>/rust/, so deleting the module folder removes them.
members = ["modules/*/rust/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
godot = "=0.5.5"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.dev]
# Engine-facing crates are slow to link; keep debug info light so the dev loop stays quick.
debug = "line-tables-only"

# Voxel building and meshing run while playing (craters, felled trees); unoptimised they are
# 10x slower, so the dev build optimises them and their dependencies. The rest stays quick to
# compile.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.voxkit_core]
opt-level = 3

[profile.dev.package.voxkit_gd]
opt-level = 3
