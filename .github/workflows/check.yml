name: check

# Manual only for now: private-repo Actions minutes cost money, so the local
# `npm run check:full` is the merge gate. Run this by hand to verify Linux.
on:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # No LFS assets yet; turn on once tests load real art, it counts against the LFS quota.
          lfs: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Cache Godot
        uses: actions/cache@v6
        with:
          path: tools/godot
          key: godot-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/lib/godot.ts') }}

      - run: node tools/get-godot.ts

      - name: Full gate
        run: node tools/check.ts --full
