name: check

# The same full gate as `npm run check:full`, on all three desktop OSes, for every pull request
# and push to main. Standard runners are free for public repositories.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          # The changesets step compares with origin/main.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Full gate
        run: node tools/check.ts --full
