name: check

# The same full gate as `npm run check:full`, for every pull request and push to main, on the
# OSes the local run (Windows) can't cover. PRs merge once the local gate passes; a red run here
# gets fixed in a follow-up. Standard runners are free for public repositories.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          # The changesets step compares with origin/main.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Full gate
        env:
          # Test runs have filled the 16 GB Linux runner; three at a time while that is open.
          GATE_SHARDS: ${{ runner.os == 'Linux' && '3' || '' }}
        run: |
          # Linux runs have died mid-test with SIGTERM and no output; log memory to see why.
          if [ "$RUNNER_OS" = Linux ]; then
            # Past 13 GB the runner itself dies and takes the log with it, so name the biggest
            # processes (a test run's arguments list its suites) and stop the tests first.
            (while sleep 15; do
              used=$(free -m | awk 'NR==2{print $3}')
              echo "mem used $used MB"
              if [ "$used" -gt 13000 ]; then
                ps -eo rss,etime,args --sort=-rss | head -5 | cut -c1-600
                pkill -f GdUnitCmdTool || true
              fi
            done) &
          fi
          node tools/check.ts --full

      - name: Kernel log after a failed Linux run
        if: failure() && runner.os == 'Linux'
        run: sudo dmesg | tail -40
